name: Build signed X-dns Debug APK

on:
  push:
    branches: [ "main", "fix/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout X-dns
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use native engine from verified v0.7.0 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/X-dns-v0.7.0-reference.apk"
          curl --fail --location --retry 3 \
            https://github.com/anonymouskeys/X-dns/releases/download/v0.7.0/X-dns-universal-v0.7.0.apk \
            --output "$APK"
          printf '%s  %s\n' \
            '1f5a99d3c24c5005e11c59d1c29b9675698c9ba6e7cc5b6092c94397832e2997' \
            "$APK" | sha256sum --check -
          python3 - "$APK" <<'PY'
          import pathlib, shutil, sys, zipfile
          target = pathlib.Path('app/src/main/jniLibs')
          members = [(abi, name) for abi in ('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64')
                     for name in ('libciadpi.so', 'libhev-socks5-tunnel.so')]
          with zipfile.ZipFile(sys.argv[1]) as archive:
              payloads = [(abi, name, archive.read(f'lib/{abi}/{name}')) for abi, name in members]
          for abi, name, data in payloads:
              if not data.startswith(b'\x7fELF'):
                  raise SystemExit(f'Invalid ELF: {abi}/{name}')
          if target.exists():
              shutil.rmtree(target)
          for abi, name, data in payloads:
              path = target / abi / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print('Verified native libraries copied from the working v0.7.0 release')
          PY

      - name: Build universal APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

          mkdir -p dist

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            dist/X-dns-debug.apk

      - name: Verify debug signature and package
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose --print-certs dist/X-dns-debug.apk
          "$TOOLS/aapt" dump badging dist/X-dns-debug.apk > package.txt
          grep -F "name='com.anonymouskeys.xdns.debug'" package.txt

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: X-dns-debug
          path: dist/X-dns-debug.apk
          if-no-files-found: error
