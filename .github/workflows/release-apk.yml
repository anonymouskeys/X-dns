name: Build X-dns unsigned release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout X-dns
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use native engine from verified v0.7.0 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/X-dns-v0.7.0-reference.apk"
          curl --fail --location --retry 3 \
            https://github.com/anonymouskeys/X-dns/releases/download/v0.7.0/X-dns-universal-v0.7.0.apk \
            --output "$APK"
          printf '%s  %s\n' \
            '1f5a99d3c24c5005e11c59d1c29b9675698c9ba6e7cc5b6092c94397832e2997' \
            "$APK" | sha256sum --check -
          python3 - "$APK" <<'PY'
          import pathlib, shutil, sys, zipfile
          target = pathlib.Path('app/src/main/jniLibs')
          members = [(abi, name) for abi in ('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64')
                     for name in ('libciadpi.so', 'libhev-socks5-tunnel.so')]
          with zipfile.ZipFile(sys.argv[1]) as archive:
              payloads = [(abi, name, archive.read(f'lib/{abi}/{name}')) for abi, name in members]
          for abi, name, data in payloads:
              if not data.startswith(b'\x7fELF'):
                  raise SystemExit(f'Invalid ELF: {abi}/{name}')
          if target.exists():
              shutil.rmtree(target)
          for abi, name, data in payloads:
              path = target / abi / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print('Verified native libraries copied from the working v0.7.0 release')
          PY

      - name: Build unsigned universal release APK
        run: |
          set -euxo pipefail

          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

          mkdir -p dist

          APK="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*release*unsigned*.apk' \
              | head -n 1
          )"

          test -n "$APK"
          test -f "$APK"

          cp \
            "$APK" \
            dist/X-dns-universal-v0.7.0-unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: X-dns-universal-v0.7.0-unsigned
          path: dist/X-dns-universal-v0.7.0-unsigned.apk
          if-no-files-found: error
