plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anonymouskeys.xdns'
    compileSdk 34

    defaultConfig {
        applicationId "com.anonymouskeys.xdns"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "0.5.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
