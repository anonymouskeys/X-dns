plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anonymouskeys.xdns'
    compileSdk 34

    defaultConfig {
        applicationId "com.anonymouskeys.xdns"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.2.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
